{{- /* 导航卡片：带图标 */ -}}
{{- $p := .page -}}
<nav class="glass-card home-card home-card--nav" style="--card-i:{{ .index }}" aria-label="快捷导航">
    <h2 class="home-card__label">导航</h2>
    <ul class="home-nav">
        {{- range site.Menus.main }}
        {{- $active := or ($p.IsMenuCurrent "main" .) ($p.HasMenuCurrent "main" .) }}
        <li>
            <a href="{{ .URL | absLangURL }}" class="home-nav__link{{ if $active }} is-active{{ end }}">
                <span class="home-nav__icon" aria-hidden="true">{{ partial "home/nav_icon.html" . }}</span>
                <span>{{ .Name }}</span>
            </a>
        </li>
        {{- end }}
    </ul>
</nav>
