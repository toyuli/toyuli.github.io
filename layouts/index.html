{{- define "main" }}
{{- $p := . }}
<div class="home-min">
    <h1 class="home-min__title">{{ site.Title }}</h1>
    {{- with site.Params.homeInfoParams }}
    <div class="home-min__intro md-content">
        {{- $opts := dict "display" "block" }}
        {{ .Content | $p.RenderString $opts }}
    </div>
    {{- end }}
    {{- with site.Params.socialIcons }}
    <div class="home-min__social">
        {{ partial "social_icons.html" (dict "align" "start") }}
    </div>
    {{- end }}
</div>
{{- end }}
