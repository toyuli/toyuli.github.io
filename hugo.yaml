baseURL: "https://toyuli.github.io/"
locale: zh-cn
defaultLanguage: zh
title: "Toyuli"
theme: ["PaperMod"]

enableRobotsTXT: true
buildDrafts: false
buildFuture: false
buildExpired: false

caches:
  images:
    dir: ':cacheDir/images'

outputs:
  home:
    - HTML
    - RSS
    - JSON

params:
  env: production
  title: "Toyuli"
  description: ""
  author: "toyuli"
  DateFormat: "2006-01-02"
  defaultTheme: auto
  disableThemeToggle: false

  ShowCodeCopyButtons: true
  UseHugoToc: true
  comments: false
  showtoc: false
  tocopen: false

  mainSections:
    - posts

  homeInfoParams:
    Title: "Toyuli"
    Content: ""

  socialIcons:
    - name: github
      url: "https://github.com/toyuli"
    - name: rss
      url: "index.xml"

menu:
  main:
    - identifier: posts
      name: 文章
      url: /posts/
      weight: 10
    - identifier: about
      name: 关于
      url: /about/
      weight: 50

pygmentsUseClasses: true
markup:
  goldmark:
    extensions:
      passthrough:
        enable: true
        delimiters:
          block: [['\[', '\]'], ['$$', '$$']]
          inline: [['\(', '\)']]
  highlight:
    noClasses: false
    codeFences: true
    guessSyntax: true
    lineNos: false
    style: monokai
