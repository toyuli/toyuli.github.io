baseURL: "https://toyuli.github.io/"
locale: zh-cn
defaultLanguage: zh
title: "Toyuli"
theme: ["PaperMod"]

enableRobotsTXT: true
buildDrafts: false
buildFuture: false
buildExpired: false

caches:
  images:
    dir: ':cacheDir/images'

outputs:
  home:
    - HTML

params:
  env: production
  title: "Toyuli"
  description: "Triton / MLIR 学习笔记"
  author: "toyuli"
  DateFormat: "2006-01-02"
  defaultTheme: auto
  disableThemeToggle: false

  assets:
    theme_color: "#faf7f2"

  ShowCodeCopyButtons: true
  UseHugoToc: true
  comments: false
  showtoc: false
  tocopen: false

  mainSections:
    - triton
    - mlir

  homeInfoParams:
    Title: "Toyuli"
    Content: |
      Triton / MLIR 学习笔记。

      [Triton](/triton/) · [MLIR](/mlir/)

  socialIcons:
    - name: github
      url: "https://github.com/toyuli"

menu:
  main:
    - identifier: notes
      name: 笔记
      url: /notes/
      weight: 10
    - identifier: archives
      name: 归档
      url: /archives/
      weight: 20
    - identifier: search
      name: 搜索
      url: /search/
      weight: 30
    - identifier: about
      name: 关于
      url: /about/
      weight: 50

pygmentsUseClasses: true
markup:
  goldmark:
    extensions:
      passthrough:
        enable: true
        delimiters:
          block: [['\[', '\]'], ['$$', '$$']]
          inline: [['\(', '\)']]
  highlight:
    noClasses: false
    codeFences: true
    guessSyntax: true
    lineNos: false
    style: monokai
